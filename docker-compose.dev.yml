services:
  discordactivity:
    image: discordactivity:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      LOG_LEVEL: debug
      SQLITE_PATH: /var/lib/discordactivity/data.sqlite
      DASHBOARD_PASSWORD: changeme
    volumes:
      - discordactivity-data:/var/lib/discordactivity
    restart: unless-stopped

volumes:
  discordactivity-data:
