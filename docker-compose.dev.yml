name: discord-activity-dev

services:
  discord-activity:
    image: discord-activity:local
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8080:8080"
    environment:
      HEALTH_ADDR: ":8080"
      LOG_LEVEL: debug
      SQLITE_PATH: /var/lib/discord-activity/data.sqlite
      DASHBOARD_PASSWORD: changeme
    volumes:
      - discord-activity-data:/var/lib/discord-activity
    restart: unless-stopped

volumes:
  discord-activity-data:
